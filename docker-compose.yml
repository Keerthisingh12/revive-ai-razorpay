services:
  postgres:
    image: postgres:16-alpine
    container_name: reviveai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reviveai
      POSTGRES_PASSWORD: reviveai_secret
      POSTGRES_DB: reviveai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviveai -d reviveai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
